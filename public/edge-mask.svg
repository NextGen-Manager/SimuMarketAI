<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" preserveAspectRatio="none">
  <defs>
    <!-- Turbulensi berfrekuensi rendah menghasilkan gumpalan besar dan lembut,
         bukan bintik halus. Perpindahan diterapkan pada gradien yang sangat
         panjang, sehingga batasnya larut berangsur alih-alih tampak sebagai
         pita kabut yang jelas ujungnya. -->
    <filter id="ragged" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.0016 0.0042"
        numOctaves="5"
        seed="11"
        result="noise" />
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="230"
        xChannelSelector="R"
        yChannelSelector="G" />
      <feGaussianBlur stdDeviation="9" />
    </filter>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0" />
      <stop offset="18%" stop-color="#000" stop-opacity="0.06" />
      <stop offset="36%" stop-color="#000" stop-opacity="0.22" />
      <stop offset="54%" stop-color="#000" stop-opacity="0.48" />
      <stop offset="72%" stop-color="#000" stop-opacity="0.74" />
      <stop offset="88%" stop-color="#000" stop-opacity="0.93" />
      <stop offset="100%" stop-color="#000" stop-opacity="1" />
    </linearGradient>
  </defs>

  <rect width="1400" height="900" fill="url(#fade)" filter="url(#ragged)" />
</svg>
