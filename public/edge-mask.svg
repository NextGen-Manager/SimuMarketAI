<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" preserveAspectRatio="none">
  <defs>
    <!-- Turbulensi memelintir batas gradien, sehingga tepinya organik
         seperti tinta menyebar — bukan garis lurus. -->
    <filter id="ragged" x="-20%" y="-40%" width="140%" height="180%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.009 0.028"
        numOctaves="4"
        seed="7"
        result="noise" />
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="78"
        xChannelSelector="R"
        yChannelSelector="G" />
    </filter>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0" />
      <stop offset="55%" stop-color="#000" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#000" stop-opacity="1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="180" fill="url(#fade)" filter="url(#ragged)" />
</svg>
